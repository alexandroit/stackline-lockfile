name: CI

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, coverage, audits, and package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm install --global npm@10.8.2
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm audit --omit=dev --audit-level=high
      - run: mkdir -p artifact
      - run: npm pack --ignore-scripts --json --pack-destination artifact
      - run: npm run check:packed -- artifact/*.tgz
      - run: npm run smoke:registry -- artifact/*.tgz
      - run: npx attw --pack artifact/*.tgz
      - run: mkdir -p release-candidate
      - run: npm run sbom
      - name: Validate SBOM JSON
        run: node -e "var x=require('./release-candidate/stackline-lockfile-1.0.6.cdx.json');if(x.bomFormat!=='CycloneDX'||!x.metadata||!x.components)process.exit(1)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }} packed consumer
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 14.17.0
          - os: ubuntu-latest
            node: 16.20.2
          - os: ubuntu-latest
            node: 18.20.8
          - os: ubuntu-latest
            node: 20.20.2
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 20.20.2
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
          - os: windows-latest
            node: 26
          - os: macos-latest
            node: 20.20.2
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 24
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
      - run: node scripts/ci-packed-consumer.cjs artifact

  source-integrity:
    name: Upstream license and source provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify preserved upstream ISC license
        run: test "$(sha256sum LICENSE | cut -d' ' -f1)" = "4ec3d4c66cd87f5c8d8ad911b10f99bf27cb00cdfcff82621956e379186b016b"
